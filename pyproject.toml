[project]
name = "map-kit"
version = "1.0.0"
description = "A lightweight Web GIS toolkit for interactive geospatial visualization and spatial analysis, with a Python pipeline for publication-ready static maps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "J. Moses" },
]
keywords = ["gis", "geospatial", "leaflet", "elevation-profile", "spatial-analysis", "web-gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "folium>=0.15",
    "contextily>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-Shapely>=2.0",
]

[project.scripts]
make-maps = "map_kit.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["map_kit*"]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["map_kit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (type checker) ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["contextily.*", "folium.*", "geopandas.*", "pyproj.*"]
ignore_missing_imports = true
